format=1
title.en=Sum of the first integers
title.it=Somma dei primi interi
instructions.en=Complete Sum.firstNumbers(n) using a loop. Return the sum of integers from 1 through n, including n. Return 0 when n is zero or negative. Run the tests to compare expected and actual results.
instructions.it=Completa Sum.firstNumbers(n) usando un ciclo. Restituisci la somma degli interi da 1 a n, incluso n. Restituisci 0 quando n e zero o negativo. Esegui i test per confrontare i valori attesi e ottenuti.
tests=SumTest
hint.1.en=Which variable keeps the partial sum between iterations?
hint.1.it=Quale variabile conserva la somma parziale tra le iterazioni?
hint.2.en=Trace n=1 and n=4 by hand. Check both the first and last values of the loop counter.
hint.2.it=Segui a mano n=1 e n=4. Controlla il primo e l'ultimo valore del contatore del ciclo.
