name: Build BlueJ light
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        shell: bash
        run: >-
          bash ./gradlew :bluej:assemble :bluej:test
          --tests bluej.editor.flow.TestLongestLine
          --tests bluej.editor.flow.TestScopeRendering
          --tests bluej.editor.flow.TestBasicEditorInteraction
          --tests bluej.editor.flow.TestAutoIndent
          --tests 'bluej.editor.flow.TestSnippet*'
          --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bluej-light-${{ matrix.os }}
          path: bluej/build/resources/main/lib
